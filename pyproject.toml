[tool.marimo.runtime]
auto_instantiate = true

[tool.marimo.display]
theme = "light"

[tool.marimo.lint]
# MF001 (general-formatting) flags from __future__ imports and TYPE_CHECKING guards
# that are required for Pylance strict mode but conflict with marimo's expected structure.
ignore = ["MF001"]

[project]
name = "marimo-jpeg-course"
version = "0.1.0"
description = "An interactive course on JPEG compression in the form of a Marimo notebook."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "marimo>=0.23.6",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pooch>=1.9.0",
    "scipy>=1.17.1",
]
